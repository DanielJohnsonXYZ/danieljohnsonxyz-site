name: Refresh dependencies

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/refresh-dependencies.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only

      - name: Apply Astro 7 source cleanup
        run: node ops/clean-deprecations.mjs

      - name: Install exact dependencies
        run: npm ci

      - name: Security audit
        run: npm audit

      - name: Astro check
        run: npm run check

      - name: Build and whole-site QA
        run: npm run build

      - name: Commit refreshed lockfile and migrated source
        run: |
          if git diff --quiet -- package-lock.json src/pages/growth-audit.astro src/pages/media-kit.astro; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/pages/growth-audit.astro src/pages/media-kit.astro
          git commit -m "chore: refresh patched dependencies"
          git push
