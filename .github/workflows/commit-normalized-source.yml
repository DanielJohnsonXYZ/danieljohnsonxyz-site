name: Commit normalized source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/commit-normalized-source.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Normalize source
        run: node ops/normalize-site-source.mjs

      - name: Commit normalized source
        run: |
          if git diff --quiet -- src; then
            echo "Source already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: persist normalized production source"
          git push
